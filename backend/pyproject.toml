[project]
name = "rotating-pharmacy-technician-roster"
version = "0.1.0"
description = "Audit a four-week pharmacy technician roster stored in Excel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
roster-audit = "roster_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "roster_audit.api:app"