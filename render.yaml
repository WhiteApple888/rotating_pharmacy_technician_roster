services:
  - type: web
    name: roster-audit-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn roster_audit.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.16
      - key: CORS_ALLOWED_ORIGINS
        sync: false
