[project]
name = "rotating-pharmacy-technician-roster"
version = "0.1.0"
description = "Audit a four-week pharmacy technician roster stored in Excel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
]

[project.scripts]
roster-audit = "roster_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
